name: CI Test

on:
    push:
        branches:
            - "dev"
            - "master"

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v2

            - uses: actions/setup-node@v4
              with:
                node-version: "26.x"
                registry-url: "https://registry.npmjs.org"

            - name: Install Packages
              run: npm ci --workspaces; npm ci

            - name: Build
              run: npm run build

            - name: Type check
              run: npm run check

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test
