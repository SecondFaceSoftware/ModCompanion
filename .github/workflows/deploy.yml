name: Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - "master"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Build prod runtime
      - name: Install prod_runtime dependencies
        working-directory: prod_runtime
        run: npm ci

      - name: Package prod_runtime
        working-directory: prod_runtime
        run: npm run package

      # Deploy app
      - name: Install app dependencies
        run: npm ci --workspaces

      - name: Install root dependencies
        run: npm ci

      - name: Deploy
        run: npm run deploy

      # Zip it up
      - name: Verify deployment directory
        run: |
          if [ ! -d "./deploy" ]; then
            echo "Error: ./deploy directory does not exist"
            exit 1
          fi
  
          if [ -z "$(ls -A ./deploy)" ]; then
            echo "Error: ./deploy directory is empty"
            exit 1
          fi

      - name: Create deployment ZIP
        run: |
          cd deploy
          zip -r ../mod_companion.zip .
          cd ..

      # Upload the release
      - name: Read version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          
          if [ -z "$VERSION" ]; then
            echo "Error: version.txt is empty"
            exit 1
          fi
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Upload deployment to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: mod_companion.zip